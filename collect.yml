name: Collect MSE deals

on:
  schedule:
    # Даваа–Баасан 05:30 UTC = Улаанбаатарын цагаар 13:30 (арилжаа 13:00-д дуусна)
    - cron: "30 5 * * 1-5"
  workflow_dispatch:   # гараар ажиллуулах товч

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect deals
        run: python collect.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "MSE deals $(date -u +%F)"
          git push
